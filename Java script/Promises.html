        // Method 2 --> async/ await --> is also used to handle Asynchronous task like promises in more clear way.

        let bodyTag = document.querySelector('body') //<body> <body>
        async function xyz(){
            let x =await fetch('https://dummyjson.com/products')
            let data = await x.json();
            console.log(data)  //{products:[{},{}], skip:5, limit:0}
            console.log(data.products)  //[{}, {} , {} , {}]

            for(let i = 0; i<data.products.length; i++){
                // console.log(data.products[i])
                console.log(data.products[i].title)
                let para = document.createElement('p');// <p> <p>
                    let imageTag = document.createElement('img')
                    imageTag.src = data.products[i].thumbnail
                    para.innerHTML = data.products[i].title;
                    bodyTag.append(imageTag, para)
            }

        }
